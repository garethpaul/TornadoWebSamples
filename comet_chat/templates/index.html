<head>
    <meta charset="utf-8" />

    <!-- Set the viewport width to device width for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Comet Chat | Tornado</title>

    <script defer src="{{ static_url('cometchat.js') }}"></script>
    <link rel="stylesheet" type="text/css" href="{{ static_url('cometchat.css') }}" media="all" />
</head>
<body>

<div id="room">
    <ul id="messages">

    </ul>
</div>
<div id="control-bar">
    <form id="message-form" method="post" action="/message">
        {% module xsrf_form_html() %}
        <input type="text" id="message" name="message" autocomplete="off" value="" maxlength="500" placeholder="Enter some text here..." />
    </form>
</div>
</body>
</html>
